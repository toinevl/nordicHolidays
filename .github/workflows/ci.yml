name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Lint frontend (#28)
        run: cd frontend && npx eslint "src/**/*.ts"

      - name: Install & build frontend
        run: cd frontend && npm run build

      - name: Run frontend tests
        run: cd frontend && npm test

      - name: Install API deps
        run: cd api && npm ci

      - name: Lint API (#28)
        run: cd api && npx eslint "src/**/*.ts"

      - name: Typecheck & build API
        run: cd api && npx tsc --noEmit

      - name: Run API tests
        run: cd api && npm test

      - name: Verify IaC platform CORS includes prod origin (#36)
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/main.json
          node infra/scripts/verify-cors.mjs /tmp/main.json

      # #45: non-blocking Bicep drift check against the live resource group.
      # OIDC login + secrets mirror deploy-api.yml; the what-if command mirrors
      # docs/deployment-runbook.md §7. continue-on-error keeps PR CI green (a
      # what-if needs Azure access and can legitimately show drift caused by
      # out-of-band console changes) — the point is VISIBILITY: drift shows up
      # as a yellow step in every main-branch run instead of going unnoticed.
      - name: Bicep what-if drift check (non-blocking, #45)
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if against rgNordicHolidays
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az deployment group what-if \
            --resource-group rgNordicHolidays \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam
